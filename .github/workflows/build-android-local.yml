name: Build Android APK (local — no EAS)

# Compiles a release APK entirely on the GitHub Actions runner using
# Expo prebuild + gradle. Doesn't touch the EAS build queue, so it
# doesn't count against the EAS free-plan monthly quota (the cloud
# workflow build-android.yml hits ~15/month and stops).
#
# Tradeoff: this workflow generates its OWN debug-style keystore each
# month (deterministic — pinned in repo secret KEYSTORE_PASSWORD), so
# the signature is DIFFERENT from the original EAS-signed APKs you've
# been sideloading. First install means uninstalling the prior Outside
# APK (Android refuses cross-signature updates). Subsequent updates
# from this workflow update cleanly because the keystore stays the same.
#
# To unify with EAS signing later (so Play Store updates work):
#   eas credentials --platform android  → Download keystore
# then base64 it into the KEYSTORE_BASE64 secret. The workflow uses
# that one if present; otherwise it generates a fallback.
#
# Trigger: manual only by default (workflow_dispatch). Add a push
# trigger if you want every commit to rebuild.

on:
  workflow_dispatch:

jobs:
  build:
    name: Local gradle APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Stamp build info into app.json
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const p = './app.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.expo.extra = j.expo.extra || {};
            j.expo.extra.buildNumber = 'gha-${{ github.run_number }}';
            j.expo.extra.gitSha = '${{ github.sha }}';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate android/ folder)
        run: npx expo prebuild --platform android --no-install --clean
        env:
          # Skip the runtime version warning during CI prebuild.
          CI: "1"

      - name: Restore or generate signing keystore
        # If KEYSTORE_BASE64 secret is set (proper key extracted from
        # EAS or generated once and stored), decode and use it. Otherwise
        # generate a deterministic fallback so subsequent local builds
        # produce updateable APKs at least relative to each other.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using KEYSTORE_BASE64 from secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "No KEYSTORE_BASE64 secret set — generating a fallback debug keystore."
            keytool -genkeypair \
              -keystore android/app/release.keystore \
              -storepass outside_dev \
              -alias outside \
              -keypass outside_dev \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -dname "CN=Outside Dev, O=Ermis, C=DE"
          fi

      - name: Wire signing config into Gradle
        # Expo's prebuilt build.gradle has a signing config that reads
        # specific gradle.properties keys (MYAPP_UPLOAD_*). Inject them
        # so assembleRelease produces a signed APK.
        run: |
          set -euo pipefail
          STORE_PW="${KEYSTORE_PASSWORD:-outside_dev}"
          KEY_PW="${KEYSTORE_PASSWORD:-outside_dev}"
          cat >> android/gradle.properties <<EOF

          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD=$STORE_PW
          MYAPP_UPLOAD_KEY_ALIAS=outside
          MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PW
          EOF
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found: $APK_PATH"
          ls -lh "$APK_PATH"
          cp "$APK_PATH" outside.apk
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "size_mb=$(du -m outside.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="gha-${{ github.run_number }}"
          COMMIT_MSG=$(git log -1 --format=%s)
          gh release create "$TAG" outside.apk \
            --title "APK gradle build #${{ github.run_number }}" \
            --notes "Compiled directly on GitHub Actions (no EAS quota used).

          Commit: $COMMIT_MSG
          Size: ${{ steps.apk.outputs.size_mb }} MB

          ⚠️  If you have a previous Outside APK installed (from EAS builds), uninstall it first — signature differs, Android refuses cross-signature updates." \
            --target "${{ github.sha }}"

      - name: Summary
        run: |
          {
            echo "## ✅ APK built locally on GitHub Actions"
            echo ""
            echo "**Install:** https://github.com/${{ github.repository }}/releases/tag/gha-${{ github.run_number }}"
            echo ""
            echo "Size: ${{ steps.apk.outputs.size_mb }} MB"
            echo ""
            echo "**First time:** uninstall the previously sideloaded Outside APK first (the signature differs from EAS builds)."
          } >> "$GITHUB_STEP_SUMMARY"
