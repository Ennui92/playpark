name: Build Android APK

# Builds an installable APK via EAS (preview profile) and posts the
# download link as a workflow summary so a phone can grab it directly.
#
# Required repo secret:
#   EXPO_TOKEN  - personal access token from https://expo.dev/accounts/[user]/settings/access-tokens

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: EAS Android preview build
    runs-on: ubuntu-latest
    # Required so `gh release create` can write a Release to this repo.
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Stamp build info into app.json
        # Inject the CI run number + commit SHA into expo.extra so the
        # app can display them in the Me screen. Lets the user verify
        # which APK they're actually running (vs. one cached from an
        # earlier install).
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const p = './app.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.expo.extra = j.expo.extra || {};
            j.expo.extra.buildNumber = '${{ github.run_number }}';
            j.expo.extra.gitSha = '${{ github.sha }}';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          cat app.json | head -25

      - name: Run EAS build (Android preview, APK)
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          # --non-interactive --no-wait queues the build and returns a JSON
          # describing it; we extract the artifact URL once it finishes.
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json \
            --wait \
            > build.json
          cat build.json
          ARTIFACT_URL=$(node -e "const b=require('./build.json');const r=Array.isArray(b)?b[0]:b;console.log(r.artifacts?.buildUrl||'');")
          BUILD_PAGE=$(node -e "const b=require('./build.json');const r=Array.isArray(b)?b[0]:b;console.log('https://expo.dev/accounts/'+r.project.ownerAccount.name+'/projects/'+r.project.slug+'/builds/'+r.id);")
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"
          echo "build_page=$BUILD_PAGE"     >> "$GITHUB_OUTPUT"

      - name: Download APK and attach to a GitHub Release
        # Bookmark https://github.com/Ennui92/playpark/releases/latest on
        # your phone. /latest auto-redirects to the most recent release,
        # so the bookmark never goes stale. GitHub Releases use different
        # CDN paths than EAS, which sidesteps the Chrome-Android 99% hang.
        if: steps.eas.outputs.artifact_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -L --fail -o outside.apk "${{ steps.eas.outputs.artifact_url }}"
          TAG="build-${{ github.run_number }}"
          COMMIT_MSG=$(git log -1 --format=%s)
          gh release create "$TAG" outside.apk \
            --title "APK build #${{ github.run_number }}" \
            --notes "$COMMIT_MSG"$'\n\n'"EAS build page: ${{ steps.eas.outputs.build_page }}" \
            --target "${{ github.sha }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
        id: release

      - name: Publish download links to summary
        run: |
          {
            echo "## ✅ APK ready"
            echo ""
            echo "**Best (bookmarkable):** https://github.com/${{ github.repository }}/releases/latest"
            echo ""
            echo "**This build:** ${{ steps.release.outputs.release_url }}"
            echo ""
            echo "**EAS direct:** ${{ steps.eas.outputs.artifact_url }}"
            echo ""
            echo "**Build page:** ${{ steps.eas.outputs.build_page }}"
          } >> "$GITHUB_STEP_SUMMARY"
